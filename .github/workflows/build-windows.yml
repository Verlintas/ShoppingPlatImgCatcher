name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Import smoke check
        run: python -c "import app.engine, app.gui.main_window, app.gui.worker, app.platforms.registry; print('imports ok')"

      - name: Build with PyInstaller
        run: python -m PyInstaller build/pyinstaller.spec --noconfirm --clean

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ShoppingPlatImgCatcher/* -DestinationPath dist/ShoppingPlatImgCatcher-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShoppingPlatImgCatcher-win64
          path: dist/ShoppingPlatImgCatcher-win64.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShoppingPlatImgCatcher-win64.zip
          generate_release_notes: true
